name: Deploy Race Tracker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy Lambda functions
        run: |
          for func in RegisterRunner CheckInRunner GetRunnerStatus SendCrewAlert ProcessDNF GenerateRaceResult UpdateLeaderboard ArchiveRaceData ValidateMarshall; do
            echo "Deploying $func..."
            zip -j $func.zip functions/$func/lambda_function.py
            aws lambda update-function-code \
              --function-name $func \
              --zip-file fileb://$func.zip \
              --region eu-west-1
          done

      - name: Deploy frontend to S3
        run: |
          aws s3 cp index.html s3://ultra-race-results-s00239846/index.html --region eu-west-1

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E26TU5K9KC7NDS \
            --paths "/index.html"